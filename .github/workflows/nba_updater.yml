name: Actualizador Diario YZ Quant NBA

on:
  schedule:
    # Se ejecuta automáticamente todos los días a las 13:17 UTC (8:17 AM hora Colombia)
    - cron: '17 13 * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub cuando quieras con 1 clic

permissions:
  contents: write

jobs:
  build-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests

      - name: Auditar jornada anterior en bitácora (si existe picks_ayer.csv)
        run: python auditar_jornada.py

      - name: Ejecutar script de actualización de estadísticas NBA
        run: python script_actualizar_nba.py

      - name: Guardar y Commit de datos actualizados en el Repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add datos_nba_hoy.json
          if [ -f bitacora_yz_quant.csv ]; then
            git add bitacora_yz_quant.csv
          fi
          git diff --staged --quiet || (git commit -m "🤖 Auto-update: Estadísticas NBA y auditoría diaria" && git pull --rebase origin main && git push)
