name: Actualizador Diario YZ Quant NBA

on:
  schedule:
    # Se ejecuta automáticamente todos los días a las 11:00 UTC (6:00 AM Colombia / ET)
    - cron: '0 11 * * *'
  workflow_dispatch:

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests nba_api

      - name: Ejecutar script de actualización dinámico
        run: python script_actualizar_nba.py

      - name: Guardar y subir cambios
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add datos_nba_hoy.json
          git commit -m "Auto-update datos NBA hoy (100% dinámico)" || exit 0
          git push
